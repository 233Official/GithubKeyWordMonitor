name: GitHub Keyword Monitor

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Create config file
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ.get("GH_TOKEN", "").strip()
          if not token:
              raise SystemExit("Missing GitHub token")

          repo = os.environ["REPO"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/variables/MONITOR_KEYWORDS",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "github-keyword-monitor-workflow",
              },
          )

          raw_keywords = ""
          try:
              with urllib.request.urlopen(request, timeout=10) as resp:
                  payload = json.load(resp)
                  raw_keywords = (payload.get("value") or "").strip()
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  print(f"Warning: failed to fetch MONITOR_KEYWORDS ({exc})", file=sys.stderr)
          except urllib.error.URLError as exc:
              print(f"Warning: unable to reach GitHub API ({exc})", file=sys.stderr)

          keywords_list: list[str]
          if not raw_keywords:
              keywords_list = ["星痕共鸣"]
          else:
              parsed = None
              if raw_keywords.startswith("[") and raw_keywords.endswith("]"):
                  try:
                      parsed = json.loads(raw_keywords)
                  except json.JSONDecodeError:
                      parsed = None

              if isinstance(parsed, list) and all(isinstance(item, str) for item in parsed):
                  keywords_list = [item for item in parsed if item.strip()]
              else:
                  keywords_list = [part.strip() for part in raw_keywords.split(",") if part.strip()]

              if not keywords_list:
                  keywords_list = ["星痕共鸣"]

          keywords_literal = ", ".join(f'"{kw}"' for kw in keywords_list)

          config_path = Path("config.toml")
          config_path.write_text(
              f"github_token = \"{token}\"\nkeywords = [{keywords_literal}]\n",
              encoding="utf-8",
          )

          preview = config_path.read_text(encoding="utf-8").replace(token, "***")
          print("Generated config.toml:\n" + preview)
          PY
      
      - name: Run monitor
        run: uv run main.py
      
      - name: Clean up runtime config
        run: rm config.toml
      
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
          fetch-depth: 0
      
      - name: Sync generated artifacts
        run: |
          set -euo pipefail
          if [ ! -f feed.xml ] && [ ! -d feeds ] && [ ! -d data ]; then
            echo "No artifacts generated; skipping sync." >&2
            exit 0
          fi

          rm -rf data-branch/data
          rm -rf data-branch/feeds
          rm -f data-branch/feed.xml

          if [ -d data ] && [ "$(ls -A data)" ]; then
            mkdir -p data-branch/data
            cp -r data/. data-branch/data/
          fi

          if [ -d feeds ] && [ "$(ls -A feeds)" ]; then
            mkdir -p data-branch/feeds
            cp -r feeds/. data-branch/feeds/
          fi

          if [ -f feed.xml ]; then
            cp feed.xml data-branch/feed.xml
          fi
      
      - name: Commit and push if changes
        working-directory: data-branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ADDED=0
          if [ -f feed.xml ]; then
            git add feed.xml
            ADDED=1
          fi
          if [ -d feeds ]; then
            git add feeds/
            ADDED=1
          fi
          if [ -d data ]; then
            git add data/
            ADDED=1
          fi
          if [ "$ADDED" -eq 0 ]; then
            echo "No artifacts to publish."
            exit 0
          fi
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update RSS feed [skip ci]"
          git push
