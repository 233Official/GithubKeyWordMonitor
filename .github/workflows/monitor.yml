name: GitHub Keyword Monitor

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  # Allow manual trigger
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Create config file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.MONITOR_PAT }}
          MONITOR_KEYWORDS: ${{ vars.MONITOR_KEYWORDS }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pat = os.environ.get("GH_PAT", "").strip()
          token = pat or os.environ.get("GH_TOKEN", "").strip()
          if not token:
              raise SystemExit("Missing GitHub token")

          if pat:
              print("Using MONITOR_PAT secret for GitHub API access")

          raw_keywords = (os.environ.get("MONITOR_KEYWORDS", "") or "").strip()
          if not raw_keywords:
              print("MONITOR_KEYWORDS not set; falling back to default keyword")

          keywords_list = []
          if raw_keywords:
              parsed = None
              if raw_keywords.startswith("[") and raw_keywords.endswith("]"):
                  try:
                      parsed = json.loads(raw_keywords)
                  except json.JSONDecodeError:
                      parsed = None

              if isinstance(parsed, list):
                  for item in parsed:
                      if isinstance(item, str):
                          trimmed = item.strip()
                          if trimmed:
                              keywords_list.append(trimmed)
              else:
                  keywords_list = [part.strip() for part in raw_keywords.split(",") if part.strip()]

          if not keywords_list:
              keywords_list = ["星痕共鸣"]

          keywords_literal = ", ".join(f'"{kw}"' for kw in keywords_list)

          config_path = Path("config.toml")
          config_path.write_text(
              f"github_token = \"{token}\"\nkeywords = [{keywords_literal}]\n",
              encoding="utf-8",
          )

          preview = config_path.read_text(encoding="utf-8").replace(token, "***")
          print("Generated config.toml:\n" + preview)
          PY

      - name: Run monitor
        run: uv run main.py

      - name: Clean up runtime config
        run: rm config.toml

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
          fetch-depth: 0

      - name: Sync generated artifacts
        run: |
          set -euo pipefail
          if [ ! -f feed.xml ] && [ ! -d feeds ] && [ ! -d data ]; then
            echo "No artifacts generated; skipping sync." >&2
            exit 0
          fi

          rm -rf data-branch/data
          rm -rf data-branch/feeds
          rm -f data-branch/feed.xml

          if [ -d data ] && [ "$(ls -A data)" ]; then
            mkdir -p data-branch/data
            cp -r data/. data-branch/data/
          fi

          if [ -d feeds ] && [ "$(ls -A feeds)" ]; then
            mkdir -p data-branch/feeds
            cp -r feeds/. data-branch/feeds/
          fi

          if [ -f feed.xml ]; then
            cp feed.xml data-branch/feed.xml
          fi

      - name: Commit and push if changes
        working-directory: data-branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ADDED=0
          if [ -f feed.xml ]; then
            git add feed.xml
            ADDED=1
          fi
          if [ -d feeds ]; then
            git add feeds/
            ADDED=1
          fi
          if [ -d data ]; then
            git add data/
            ADDED=1
          fi
          if [ "$ADDED" -eq 0 ]; then
            echo "No artifacts to publish."
            exit 0
          fi
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update RSS feed [skip ci]"
          git push
